name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AndroidDeveloper site
        uses: actions/checkout@v4
        with:
          repository: touktw/AndroidDeveloper
          ref: main
          path: _androiddeveloper
      
      - name: Checkout AdbTool site
        uses: actions/checkout@v4
        with:
          repository: touktw/AdbTool
          ref: main
          path: _adbtool

      - name: Stage static files
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' ./ _site/
          rm -rf _site/_androiddeveloper
          rm -rf _site/_adbtool
          mkdir -p _site/projects/androiddeveloper
          mkdir -p _site/projects/adbtool
          rsync -a --exclude='.git' _androiddeveloper/docs/site/ _site/projects/androiddeveloper/
          rsync -a --exclude='.git' _adbtool/docs/site/ _site/projects/adbtool/

          if [ -f "_site/projects/androiddeveloper/download.html" ]; then
            mv -f _site/projects/androiddeveloper/download.html _site/projects/androiddeveloper/index.html
          fi
          if [ -f "_site/projects/adbtool/download.html" ]; then
            mv -f _site/projects/adbtool/download.html _site/projects/adbtool/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
